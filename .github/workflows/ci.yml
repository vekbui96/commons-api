name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node 24 (server-pc runs 24 too).
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify (format, typecheck, lint, test)
        run: npm run verify
      - name: Boot smoke test
        run: |
          COMMONS_PORT=8790 COMMONS_DB_PATH="$RUNNER_TEMP/commons.db" npm start &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8790/api/health && exit 0
            sleep 1
          done
          exit 1

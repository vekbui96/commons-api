name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node 24 (server-pc runs 24 too).
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify (format, typecheck, lint, test)
        run: npm run verify
      - name: Build (plain JS in dist/)
        run: npm run build
      - name: Boot smoke test (compiled, production mode)
        run: |
          NODE_ENV=production COMMONS_PORT=8790 COMMONS_DB_PATH="$RUNNER_TEMP/commons.db" node dist/index.js &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8790/api/health; then
              # owner-only routes refuse a request with no tailnet identity
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/session)
              echo; echo "/api/session -> $code"
              [ "$code" != "200" ] && exit 0
              exit 1
            fi
            sleep 1
          done
          exit 1
